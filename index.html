<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新津 力 — プロフィール</title>
<style>
  :root{
    --teal:#2e6e62; --teal-d:#24564c; --ink:#222; --sub:#6b6b6b;
    --card:#ffffff; --line:#e7e3da;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:16px/1.6 -apple-system,"Hiragino Sans",sans-serif;color:var(--ink);
    min-height:100vh;display:flex;justify-content:center;
    background:linear-gradient(160deg,#eef4f2 0%,#f6f3ec 100%);
    padding:36px 18px;
  }
  .wrap{width:100%;max-width:440px}
  .avatar{
    width:104px;height:104px;border-radius:50%;margin:8px auto 16px;
    background:linear-gradient(145deg,var(--teal),var(--teal-d));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:44px;font-weight:600;
    box-shadow:0 8px 22px rgba(46,110,98,.28);
  }
  h1{text-align:center;font-size:24px;letter-spacing:.02em}
  .reading{text-align:center;color:var(--sub);font-size:13px;margin-top:2px}
  .tagline{text-align:center;color:var(--sub);font-size:14px;margin:12px auto 4px;max-width:340px}
  .links{margin-top:26px;display:flex;flex-direction:column;gap:12px}
  a.link{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 18px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .12s ease,box-shadow .12s ease;
  }
  a.link:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.10)}
  .ico{width:26px;height:26px;flex:0 0 26px;display:flex;align-items:center;justify-content:center}
  .ico svg{width:24px;height:24px}
  .sub{color:var(--sub);font-weight:400;font-size:13px;margin-left:auto;white-space:nowrap}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:30px}
</style>
</head>
<body>
  <main class="wrap">
    <div class="avatar">力</div>
    <h1>新津 力</h1>
    <div class="reading">Riki Niitsu</div>
    <p class="tagline">まちの変化を観察する学生。地域と地域をつなぐ「あいだ社中」を構想中。</p>

    <nav class="links">
      <a class="link" href="https://www.instagram.com/aeva_arte/" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#E1306C" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#E1306C" stroke="none"/></svg></span>
        Instagram <span class="sub">@aeva_arte</span>
      </a>
      <a class="link" href="mailto:192418ringowatch@gmail.com">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#2e6e62" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
        メール <span class="sub">お問い合わせ</span>
      </a>
    </nav>

    <footer>© 2026 Riki Niitsu</footer>
  </main>
</body>
</html>
